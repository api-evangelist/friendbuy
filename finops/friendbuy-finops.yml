principles:
- name: Visibility
  description: Track distributed advocate rewards, friend incentives, and loyalty redemptions per campaign via the Analytics API alongside the flat subscription fee.
- name: Allocation
  description: Map campaigns to product lines or teams so reward payouts attribute to the revenue they drive.
- name: Optimization
  description: Tune reward amounts and eligibility rules against referral ROI; use blocking (postBlockUsers) to curb reward fraud; right-size the plan tier to actual monthly company sales.
- name: Accountability
  description: Assign campaign owners and review monthly reward spend against referral-driven revenue and the committed subscription.
