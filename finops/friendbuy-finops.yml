description: >-
  FinOps view of Friendbuy spend. Friendbuy is billed as a SaaS subscription
  (quote-based, contact-sales) tiered on the merchant's total monthly company
  sales volume rather than on API usage - the Merchant API is an included
  capability, not a metered line item. The two dominant cost drivers are the
  platform subscription fee (reported roughly $249/mo Starter, $749/mo Deluxe,
  custom Enterprise) and, separately, the variable reward payouts the program
  distributes to customers (advocate rewards, friend incentives, and loyalty
  redemptions). Add-ons such as tiered loyalty are reported to add fixed monthly
  cost. Because reward payouts scale with referral and loyalty performance, they
  behave like a usage/variable cost even though the platform fee is flat.
notes: >-
  Per-unit API pricing does not apply; there is no metered API charge. Treat the
  subscription as a fixed committed cost and the distributed rewards/incentives
  as the variable, performance-driven spend to monitor. Figures are indicative
  from third-party sources and not reconciled against a Friendbuy quote.
