note: >-
  Friendbuy publishes no first-party client library in npm, PyPI, RubyGems,
  Packagist, Maven Central, NuGet, crates.io or pkg.go.dev — searched
  2026-08-13, all misses. Its only first-party distributed library is the
  browser Merchant SDK, which is loaded from Friendbuy's own CDN
  (static.fbot.me) with an UNPINNED URL, plus a per-merchant campaign bundle at
  campaign.fbot.me/<merchantId>/campaigns.js. Because the CDN URL carries no
  version segment and no registry metadata endpoint exists, a consumer cannot
  tell which build they are executing — that is the finding, recorded as
  `version: null`. Third-party packages (Segment destinations, community PHP
  wrappers) are listed with `official: false`.
packages:
- language: javascript
  registry: cdn
  name: friendbuy.js (Merchant SDK)
  url: https://static.fbot.me/friendbuy.js
  install: <script src="https://static.fbot.me/friendbuy.js" async></script>
  official: true
  version: null
  published: null
  note: >-
    Unpinned CDN distribution — the documented loader points at a floating
    "latest" URL with no version segment, so there is no version a consumer can
    assert. The only currency signal the origin exposes is the object's
    Last-Modified header, 2026-07-27 (checked 2026-08-13), and
    Cache-Control: max-age=300. No jsDelivr/unpkg mirror exists (not an npm
    package). Documented at https://developers.friendbuy.com under
    "Merchant SDK Javascript".
- language: javascript
  registry: cdn
  name: campaigns.js (per-merchant campaign bundle)
  url: https://campaign.fbot.me/{merchantId}/campaigns.js
  install: <script src="https://campaign.fbot.me/REPLACE_WITH_YOUR_MERCHANT_ID/campaigns.js" async></script>
  official: true
  version: null
  published: null
  note: >-
    Templated, per-merchant bundle emitted by Friendbuy for the campaigns
    configured in the Retailer App. Not a versioned artifact and not
    independently fetchable without a merchant ID, so no version or publish
    date exists to record.
