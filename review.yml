  reason: |
    No WebSocket protocol surface exists. Friendbuy's own public API is
    request/response REST (the Merchant API) plus a browser JavaScript widget
    SDK for client-side event tracking. No AsyncAPI document was created because
    there is no server-push transport on Friendbuy's own API to model.
