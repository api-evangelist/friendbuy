aid: friendbuy
name: Friendbuy
review:
  question: Does Friendbuy expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Friendbuy's public developer surface is
    the Merchant API - a request/response REST API over HTTPS (base
    https://mapi.fbot.me/v1). There is no server-push transport (WebSocket or
    SSE) on Friendbuy's own API to model. Friendbuy's real-time-feeling
    behavior on the merchant side is the front-end widget JavaScript SDK
    (friendbuy.js) firing tracking events into Friendbuy, plus outbound
    server-to-server tracking calls the merchant makes (postPurchaseEvent,
    postSignUpEvent, postCustomEvent). None of these is a bidirectional
    WebSocket channel that Friendbuy documents for consumers to connect to.
findings:
  summary: |
    Friendbuy does not publish a documented public WebSocket API. Friendbuy is a
    referral and loyalty marketing platform. Its documented server-to-server
    surface is the Merchant API at https://mapi.fbot.me/v1, authenticated with a
    Bearer JWT obtained by exchanging an account key and secret at
    POST /authorization. Every documented endpoint is request/response REST over
    HTTPS. Friendbuy also ships a browser JavaScript widget/SDK (friendbuy.js)
    that fires client-side tracking events, and it can send outbound webhooks/
    tracking to configured destinations, but neither is a WebSocket. No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented on Friendbuy's own API.
  accessModel: |
    The Merchant API and production credentials are gated. Friendbuy uses
    quote-based, contact-sales pricing (reported tiers around Starter ~$249/mo,
    Deluxe ~$749/mo, and custom Enterprise, tied to monthly company sales
    volume); there is no self-serve public sign-up that grants API keys. The
    key and secret used at POST /authorization are issued from the Friendbuy
    Developer Center to paying accounts. The documentation at
    developers.friendbuy.com is public and readable without an account.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://mapi.fbot.me/v1
      documented: true
      note: The Merchant API - customers, referrals, events, analytics, loyalty/ledger. Bearer JWT auth.
    - protocol: JavaScript Widget SDK
      scheme: https
      documented: true
      note: Browser friendbuy.js widget fires client-side tracking events (page views, purchases, sign-ups). Not a WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Friendbuy Merchant API as of the review date.
