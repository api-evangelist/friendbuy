aid: friendbuy
url: https://raw.githubusercontent.com/api-evangelist/friendbuy/refs/heads/main/apis.yml
name: Friendbuy
kind: company
description: Friendbuy is a referral and loyalty marketing platform for ecommerce
  and direct-to-consumer brands. Merchants launch referral, loyalty, and reward
  campaigns through on-site widgets and a no-code dashboard, and integrate
  server-to-server through the Friendbuy Merchant API (base
  https://mapi.fbot.me/v1). The Merchant API lets merchants sync customer
  records, generate personal referral links, track purchase / sign-up / custom
  conversion events, pull campaign and reward analytics, and manage loyalty
  ledger balances, adjustments, redemptions, and coupons. Authentication is a
  key/secret exchange at POST /authorization that returns a short-lived Bearer
  JWT. Access to the API and to production credentials is gated behind a paid,
  contact-sales plan.
